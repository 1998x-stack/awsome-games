name: Research source drift check
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned project requirements
        run: python -m pip install -r requirements.txt
      - name: Compare approved upstream metadata without mutations
        shell: bash
        run: |
          set -euo pipefail
          python scripts/refresh_research.py --dry-run | tee research-drift.json
      - name: Verify project snapshot and integrity
        run: |
          python scripts/build_catalog.py --check
          python scripts/check_catalog.py
      - name: Archive drift summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-drift-summary
          path: research-drift.json
          if-no-files-found: warn
          retention-days: 30
# No commits, cloning, source promotion or website deployment from this scheduled job.
