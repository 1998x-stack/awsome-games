name: Validate catalog
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/build_catalog.py
      - run: python -m compileall -q scripts tests
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_catalog.py
      - run: python scripts/audit_database.py --profile full
      - run: python -m compileall -q scripts tests
      - run: python -m unittest discover -s tests -v
      - run: node --check site/assets/app.js
      - run: node --check site/assets/research.js
      - run: node --check site/assets/review.js
      - run: bash -n scripts/*.sh scripts/isolation/*.sh bootstrap.sh
      - run: python scripts/build_site.py
