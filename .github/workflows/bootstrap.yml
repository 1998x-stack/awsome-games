name: Bootstrap complete source tree
on:
  push:
    branches: [main]
    paths:
      - 'bootstrap/awsome-games-bootstrap-v2.tar.gz'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: bootstrap-awsome-games
  cancel-in-progress: false
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Expand vetted initial project source
        run: |
          tar -tzf bootstrap/awsome-games-bootstrap-v2.tar.gz >/dev/null
          tar -xzf bootstrap/awsome-games-bootstrap-v2.tar.gz -C .
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v
          python scripts/build_catalog.py --check
          python scripts/check_catalog.py
          python scripts/build_site.py
          node --check site/assets/app.js
      - name: Commit expanded source files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'feat: import reviewed Fable game catalog and collector'
            git push origin HEAD:main
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
